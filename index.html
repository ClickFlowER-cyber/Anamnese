<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Silencia erros benignos do WebSocket e do Vite causados pelo HMR desligado no ambiente sandbox
      (function() {
        var isBenign = function(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err || '');
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('vite') !== -1 ||
            str.indexOf('HMR') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isBenign(event.reason) || (event.reason && isBenign(event.reason.message))) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isBenign(event.message) || isBenign(event.error)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
